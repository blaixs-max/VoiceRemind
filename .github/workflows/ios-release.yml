name: iOS Release (EAS Build + Submit)

# Manual iOS build + optional App Store Connect submit via EAS.
# Trigger: GitHub Actions tab → "iOS Release" → "Run workflow"
#
# Prerequisites (one-time setup — see CLAUDE.md):
#   - EXPO_TOKEN                     (repo secret) — from expo.dev/settings/access-tokens
#   - EXPO_PUBLIC_SUPABASE_URL       (repo secret) — Supabase project URL
#   - EXPO_PUBLIC_SUPABASE_ANON_KEY  (repo secret) — Supabase publishable anon key
#   - Apple ASC API Key must already be registered on EAS (it is — key `5U3M99K3LJ`)
#
# What this does:
#   1. Installs deps + writes .env from GitHub secrets
#   2. Runs `eas build --platform ios --profile production --non-interactive`
#   3. If auto-submit=true, `--auto-submit` uploads binary to App Store Connect
#      when build finishes. Otherwise you submit manually later with
#      `eas submit --platform ios --latest`.
#
# After successful run:
#   - Binary appears in App Store Connect → TestFlight (processing ~30 min)
#   - Then App Store Connect → App Store → Voicely AI → "Add for Review" → submit
#   - Apple review 24-72h → auto-release to users (if configured)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      auto_submit:
        description: 'Auto-submit to App Store Connect after build'
        required: true
        default: true
        type: boolean

# Only one iOS release in flight at a time — avoids Apple upload collisions
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    name: EAS iOS Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    # EAS CLI EXPO_TOKEN'ı env'den okuyor — non-interactive auth için yeterli,
    # `eas login` çalıştırmaya gerek yok.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install EAS CLI
        # expo/expo-github-action@v8 kullanmıyoruz — v8 yarn'ı çağırıyor
        # ama runner'da yarn yok → exit 1. Direkt npm install cleaner.
        run: npm install -g eas-cli

      - name: Verify EAS auth
        run: eas whoami

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secrets
        # .env gitignore'da olduğu için EAS Build sunucusuna repo ile gitmez;
        # burada CI-time'da secret'lardan üretiyoruz. Build sunucusuna eas.json'daki
        # env variable'lar üzerinden gidecek — bu .env de expo build fingerprint
        # hesaplaması ve local check için yeterli.
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EOF
          echo "✅ .env created ($(wc -l < .env) lines)"

      - name: TypeScript check (fail fast)
        run: npx tsc --noEmit

      - name: EAS Build iOS (with optional auto-submit)
        # --non-interactive: prompt sormaz, secret'lar üzerinden ilerler
        # --auto-submit: build biter bitmez App Store Connect'e upload eder
        # Not: Build Expo cloud'da çalışıyor, bu job sadece bekliyor + status raporluyor.
        run: |
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            echo "Building iOS + auto-submitting to App Store Connect..."
            eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --auto-submit
          else
            echo "Building iOS (no auto-submit — run 'eas submit' later)..."
            eas build --platform ios --profile ${{ inputs.profile }} --non-interactive
          fi

      - name: Summary
        if: always()
        run: |
          echo "## iOS Release Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile**: ${{ inputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-submit**: ${{ inputs.auto_submit }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Check https://expo.dev/accounts/blaixs/projects/VoiceRemind/builds for build status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            echo "2. Wait ~30 min → App Store Connect → TestFlight processing" >> $GITHUB_STEP_SUMMARY
            echo "3. App Store Connect → App Store tab → Add build → Submit for Review" >> $GITHUB_STEP_SUMMARY
          else
            echo "2. When build finishes, trigger 'eas submit --platform ios --latest' manually" >> $GITHUB_STEP_SUMMARY
          fi
