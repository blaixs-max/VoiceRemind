name: Supabase Keep-Alive

# Supabase Free tier projeleri 1 hafta inaktivite sonrası auto-pause oluyor.
# Bu workflow REST API + Edge Function'lara periyodik ping atarak aktiviteyi canlı tutar.
# Çalışma sıklığı: haftada 2 kez (Salı + Cuma, 12:00 UTC) — 1 hafta limitinin altında güvenli marj.
#
# Self-healing: son adımda kendi log dosyasını commit'ler → GitHub'ın 60 gün inaktivite
# sonrası scheduled workflow'u disable etme kuralına takılmaz. Aksi halde repo'ya el
# değmezse cron ölür → Supabase pause olur → veri sessizce görünmez olur (INCIDENT 2026-06-01).

on:
  schedule:
    # Cron: dakika saat gün-ay ay haftanın-günü
    # Salı + Cuma 12:00 UTC
    - cron: '0 12 * * 2,5'
  # Manual tetikleme imkanı (Actions tab → Run workflow)
  workflow_dispatch:

# Sadece bir tane workflow aynı anda çalışsın (race condition önle)
concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Self-healing commit için contents:write gerekli
    permissions:
      contents: write

    env:
      SUPABASE_URL: https://dtepkruumsxlflyzfeut.supabase.co
      # Publishable anon key — client-side için tasarlanmış, RLS koruyor, exposed olması OK
      SUPABASE_ANON_KEY: sb_publishable_weQnIg1g5Ru1RN0Dl__nwA_hOw4zkmS

    steps:
      - name: Checkout repo (self-heal commit için)
        uses: actions/checkout@v4
        with:
          # actions/checkout default token'ı ile push edeceğiz
          persist-credentials: true
      - name: Ping Auth health
        run: |
          echo "Pinging Supabase Auth health endpoint..."
          response=$(curl -s -o /tmp/auth_body -w "%{http_code}" \
            "${SUPABASE_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            --max-time 30)
          echo "Auth health: HTTP $response"
          if [ "$response" != "200" ]; then
            echo "❌ Auth health beklenmeyen status: $response"
            cat /tmp/auth_body
            exit 1
          fi
          echo "✅ Auth aktif"

      - name: Ping REST API (RLS-protected table query)
        run: |
          echo "Pinging REST API via RLS table query (aktivite sayılar)..."
          response=$(curl -s -o /tmp/rest_body -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/reminders?limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            --max-time 30)
          echo "REST API response: HTTP $response"
          # 200 = OK (RLS boş array döner — auth yok), 401/403 = auth issue, 5xx = DB sorunu
          if [ "$response" != "200" ]; then
            echo "❌ REST API beklenmeyen status: $response"
            cat /tmp/rest_body
            exit 1
          fi
          echo "✅ REST API + Postgres aktif"

      - name: Ping Edge Functions (OPTIONS)
        run: |
          echo "Pinging parse-reminder Edge Function (OPTIONS preflight)..."
          response=$(curl -s -o /tmp/parse_body -w "%{http_code}" \
            "${SUPABASE_URL}/functions/v1/parse-reminder" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -X OPTIONS \
            --max-time 30)
          echo "parse-reminder OPTIONS: HTTP $response"
          # OPTIONS preflight 200 veya 204 dönmeli (CORS)
          if [ "$response" != "200" ] && [ "$response" != "204" ]; then
            echo "⚠️  parse-reminder OPTIONS beklenmeyen status: $response"
            cat /tmp/parse_body
          else
            echo "✅ parse-reminder aktif"
          fi

          echo ""
          echo "Pinging delete-account Edge Function (OPTIONS preflight)..."
          response2=$(curl -s -o /tmp/delete_body -w "%{http_code}" \
            "${SUPABASE_URL}/functions/v1/delete-account" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -X OPTIONS \
            --max-time 30)
          echo "delete-account OPTIONS: HTTP $response2"
          if [ "$response2" != "200" ] && [ "$response2" != "204" ]; then
            echo "⚠️  delete-account OPTIONS beklenmeyen status: $response2"
            cat /tmp/delete_body
          else
            echo "✅ delete-account aktif"
          fi

      - name: Summary
        run: |
          echo "## Supabase Keep-Alive Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: dtepkruumsxlflyzfeut" >> $GITHUB_STEP_SUMMARY
          echo "- **Next run**: ~3 gün sonra (Salı/Cuma 12:00 UTC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ping atarak Supabase Free tier inaktivite timer'ını sıfırladık." >> $GITHUB_STEP_SUMMARY

      # Self-heal: Log dosyasına timestamp yaz + commit + push.
      # Bu commit "repo aktivitesi" sayılıyor → GitHub'ın 60 gün inaktivite sonrası
      # scheduled workflow'u otomatik disable etme politikasına takılmayız.
      # 2026-08-04 sonrası cron'un ölmesinin sebebi buydu — 60 gün push yoktu.
      - name: Self-heal — timestamp commit (60-day GitHub inactivity fix)
        run: |
          mkdir -p .github
          echo "Last keep-alive run: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .github/keep-alive-log.txt
          echo "Run: ${{ github.run_number }} | Trigger: ${{ github.event_name }}" >> .github/keep-alive-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keep-alive-log.txt

          # Sadece gerçek değişiklik varsa commit at (timestamp her seferinde değişir zaten)
          if git diff --staged --quiet; then
            echo "No changes to commit (should not happen — timestamp always differs)"
          else
            git commit -m "chore(ci): keep-alive log — $(date -u +'%Y-%m-%d %H:%M UTC')

Auto-generated by supabase-keep-alive workflow to keep this scheduled
cron alive against GitHub's 60-day inactivity policy that would otherwise
disable it and let Supabase Free tier auto-pause the project."
            git push
            echo "✅ Self-heal commit pushed"
          fi
